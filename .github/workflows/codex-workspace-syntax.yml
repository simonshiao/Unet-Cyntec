name: Codex Workspace syntax check

on:
  pull_request:
    paths:
      - 'CodexWorkspace-v0.5.0/**'
      - '.github/workflows/codex-workspace-syntax.yml'
  workflow_dispatch:

jobs:
  py-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        shell: pwsh
        run: |
          python -m py_compile "CodexWorkspace-v0.5.0/Codex_Workspace_v0.5.0_JSON_Engine.py"
      - name: Upload ready-to-extract release
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Workspace-v0.5.0-Ready
          path: |
            CodexWorkspace-v0.5.0/Codex_Workspace_v0.5.0_JSON_Engine.py
            CodexWorkspace-v0.5.0/install_and_start.bat
            CodexWorkspace-v0.5.0/README.md
          if-no-files-found: error
