name: Codex Workspace syntax check

on:
  push:
    paths:
      - 'CodexWorkspace-v0.5.0/**'
      - '.github/workflows/codex-workspace-syntax.yml'
  pull_request:
    paths:
      - 'CodexWorkspace-v0.5.0/**'
      - '.github/workflows/codex-workspace-syntax.yml'
  workflow_dispatch:

jobs:
  py-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        shell: pwsh
        run: |
          python -m py_compile "CodexWorkspace-v0.5.0/Codex_Workspace_v0.5.0_JSON_Engine.py"
