name: Validate Codex Workspace v0.5

on:
  push:
    branches: [codex-workspace-v0.5-json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex-workspace-v0.5-json
      - name: Patch UTF-8 native stdin and save-before-start
        shell: python
        run: |
          from pathlib import Path
          p = Path('Codex_Workspace_v0.5.1_JSON引擎_穩定終端版.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '"[Console]::OutputEncoding=[System.Text.UTF8Encoding]::new($false);"\n            "$env:NO_COLOR=\'1\';"',
              '"$OutputEncoding=[System.Text.UTF8Encoding]::new($false);"\n            "[Console]::OutputEncoding=$OutputEncoding;"\n            "[Console]::InputEncoding=$OutputEncoding;"\n            "$env:NO_COLOR=\'1\';"'
          )
          s = s.replace(
              "$('btnRun').onclick=()=>ready?bridge.markNotReady():bridge.markReady();",
              "$('btnRun').onclick=()=>{if(ready){bridge.markNotReady();return}bridge.saveSettings(JSON.stringify(collectSettings()));setTimeout(()=>bridge.markReady(),220)};"
          )
          p.write_text(s, encoding='utf-8')
      - name: Python syntax check
        run: python -m py_compile 'Codex_Workspace_v0.5.1_JSON引擎_穩定終端版.py'
      - name: JavaScript syntax check
        shell: python
        run: |
          import re
          from pathlib import Path
          s = Path('Codex_Workspace_v0.5.1_JSON引擎_穩定終端版.py').read_text(encoding='utf-8')
          m = re.search(r'<script>\n(.*?)\n</script>', s, re.S)
          if not m:
              raise SystemExit('embedded JavaScript not found')
          Path('/tmp/workspace.js').write_text(m.group(1), encoding='utf-8')
      - run: node --check /tmp/workspace.js
      - name: Commit patched file
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'Codex Workspace Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add 'Codex_Workspace_v0.5.1_JSON引擎_穩定終端版.py'
          git commit -m 'Fix UTF-8 prompt piping and save settings before start'
          git push origin HEAD:codex-workspace-v0.5-json
